[EXPERIMENT]
output directory = results/COVID_Haniffa21-GGpp-covid-eps1_gpr20_ms1000_round20/CrossVal_1000/stage1/GRouNdGAN
simulated path = data/generated/COVID_Haniffa21-GGpp-covid-eps1_gpr20_ms1000_round20/CrossVal_1000/stage1/GRouNdGAN_CC/simulated_trainsize.h5ad
device = cuda ; we will let the program choose what is available
random_seed = 1000 ; seed all experiments
checkpoint 

    [Privacy]
    nodp = False
    epsilon = 1
    delta = 1e-5
    max_norm = 1
    groups_per_round = 20 ; Number of groups per round
    total_round = 20 ; 2000 ; 100
    max_steps_per_group = 1000 ; 100 ; 2000
    crit_dp_mode = none
    

    [GRN Preparation]
    TFs = data/raw/Homo_sapiens_TF.csv
    k = 10 ; k is the number of top most important TFs per gene to include in the GRN 
    GRNBoost2 seed = 1
    Inferred GRN = data/processed/COVID_Haniffa21-GGpp-covid/CrossVal_1000/KB_Sapien/freq_None/Seed1/GRNB2/inferred.csv

    [Preprocessing]
    10x = False
    raw = data/raw/COVID_Haniffa21/haniffa21.h5ad
    validation set size = 1000 
    test set size
    annotations 
    min cells = 1000 ; genes expressed in less than {test set size} cells are discarded
    min genes = 10 ; cells with less than 10 genes expressed are discarded
    library size = 20000 ; library size used for library-size normalization
    louvain res = 0.15 ; Louvain clustering resolution (higher resolution means finding more and smaller clusters)
    highly variable number = 1000 ; number of highly variable genes to identify

    [Data]
    train = data/processed/COVID_Haniffa21-GGpp-covid/CrossVal_1000/train.h5ad
    validation = data/processed/COVID_Haniffa21-GGpp-covid/CrossVal_1000/validation.h5ad
    test = data/processed/COVID_Haniffa21-GGpp-covid/CrossVal_1000/test.h5ad
    number of genes = 1000
    
    ; this causal graph is a pickled nested dictionary
    ; nested dictionary keys are gene indices
    ; the dictionary is of this form:
    ; {381: {51, 65, 353, 664, 699},
    ; 16: {21, 65, 353, 605, 699},
    ; ...
    ; 565: {18, 51, 65, 552, 650}}
    ; In this example, 381, 16, and 565 are gene indices in the input dataset
    ; Each key's (gene's) value is the indiced of its regulating TFs in the input dataset
    ; A tutorial will be made available in the future.

    [Generation]
    number of cells to generate = test_size ; 66579 ; 66579
    number of times to generate = 4 ; 1 ; 1
    
    [Model]
    type = DP GAN
    critic layers = 1024 512 256
    generator layers = 256 512 1024
    latent dim = 128 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty


    [Training]
    batch size = 128 
    critic iterations = 5 ; iterations to train the critic for each iteration of the generator

        [Optimizer]
        ; coefficients used for computing running averages of gradient and its square 
        beta1 = 0.5
        beta2 = 0.9

        [Learning Rate]
        generator initial = 0.0001
        generator final = 0.0001
        critic initial = 0.0001
        critic final = 0.0001


        [Logging]
        summary frequency = 5
        plot frequency = 500
        save frequency = 500
